# Instalación con almacenamiento gestionado por Docker: no requiere DATA_DIR ni permisos del NAS.
services:
  pastillas:
    build:
      context: https://github.com/kadyto/pastillas/archive/refs/heads/main.tar.gz
      dockerfile_inline: |
        FROM python:3.12-slim

        ARG SOURCE_DIR=.
        LABEL org.opencontainers.image.title="Pastillas" \
              org.opencontainers.image.description="Medicamentos, tomas, recetas y existencias en tu servidor" \
              org.opencontainers.image.source="https://github.com/kadyto/pastillas" \
              org.opencontainers.image.version="0.3.0"

        ENV PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1 \
            DATABASE_PATH=/data/pastillas.sqlite \
            PORT=8000

        WORKDIR /app
        # SOURCE_DIR permite tanto construir desde una carpeta como desde el .tar.gz de GitHub.
        COPY $${SOURCE_DIR}/app ./app
        RUN mkdir /data /backups && chown -R 10001:10001 /app /data /backups
        USER 10001:10001
        EXPOSE 8000
        HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
            CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
        CMD ["python", "-m", "app.server"]
      args:
        SOURCE_DIR: pastillas-main
    init: true
    restart: unless-stopped
    # Coincide con el propietario de /data en la imagen; Docker lo conserva al crear el volumen.
    user: "10001:10001"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8092}:8000"
    environment:
      DATABASE_PATH: /data/pastillas.sqlite
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:?Define tu usuario inicial}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Define una contraseña de al menos 12 caracteres}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TZ: Europe/Madrid
    volumes:
      - pastillas_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s

volumes:
  pastillas_data:
