# Replica de un proxy HTTP/HTTPS con terminación TLS, como Nginx Proxy Manager.
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://pastillas-proxy-backend:8000;
        proxy_set_header Host backend-interno:8000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    location / {
        proxy_pass http://pastillas-proxy-backend:8000;
        proxy_set_header Host backend-interno:8000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 444 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    location / {
        proxy_pass http://pastillas-proxy-backend:8000;
        proxy_set_header Host backend-interno:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Simula un proxy que pierde la cookie para comprobar el mensaje al usuario.
        proxy_hide_header Set-Cookie;
    }
}
