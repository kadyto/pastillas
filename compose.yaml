services:
  pastillas:
    build:
      context: .
    init: true
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8092}:8000"
    environment:
      DATABASE_PATH: /data/pastillas.sqlite
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:?Define tu usuario inicial}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Define una contraseña de al menos 12 caracteres}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - "${DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
