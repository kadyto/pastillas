name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/sw.js
      - name: Validate Compose
        env:
          DATA_DIR: /tmp/pastillas-data
          INITIAL_ADMIN_USER: testuser
          INITIAL_ADMIN_PASSWORD: ci-only-password-1234
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.dockhand.yaml config --quiet
          docker compose -f compose.dockhand.volume.yaml config --quiet
          docker compose -f compose.dockhand.volume.yaml config --format json | python -c "import json,sys,pathlib; c=json.load(sys.stdin); assert c['services']['pastillas']['build']['dockerfile_inline'].replace(chr(36)*2,chr(36)).strip()==pathlib.Path('Dockerfile').read_text().strip()"
      - name: Build and smoke-test container
        run: |
          docker build -t pastillas:test .
          docker run -d --name pastillas-ci -v /data --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=32m -p 127.0.0.1:8092:8000 pastillas:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8092/healthz
          curl -fsS http://127.0.0.1:8092/ | head -c 300
          docker rm -fv pastillas-ci
      - name: Verify Dockhand volume installation and persistence
        env:
          INITIAL_ADMIN_USER: testuser
          INITIAL_ADMIN_PASSWORD: ci-only-password-1234
          APP_PORT: '8094'
          BIND_ADDRESS: 127.0.0.1
        run: |
          trap 'docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml down --volumes' EXIT
          docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml up --build -d --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:8094/healthz
          docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml exec -T pastillas python -c "from app.db import connect; db=connect(); db.execute('CREATE TABLE storage_probe (value INTEGER)'); db.execute('INSERT INTO storage_probe VALUES (37)'); db.commit(); db.close()"
          docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml down
          docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml up --no-build -d --wait --wait-timeout 90
          docker compose -p pastillas-storage-check -f compose.dockhand.volume.yaml exec -T pastillas python -c "from app.db import connect; db=connect(); assert db.execute('SELECT value FROM storage_probe').fetchone()[0]==37; db.close()"
      - name: Browser smoke test
        run: |
          npm install --prefix /tmp/pastillas-browser --no-audit --no-fund playwright-core
          DATABASE_PATH=/tmp/pastillas-browser.sqlite HOST=127.0.0.1 PORT=8093 python -m app.server &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8093/healthz; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE=/tmp/pastillas-browser/node_modules/playwright-core CHROMIUM_PATH=/usr/bin/google-chrome TEST_BASE_URL=http://127.0.0.1:8093 node tests/browser_smoke.cjs
      - name: Verify sessions through an HTTP and HTTPS Nginx proxy
        run: |
          mkdir -p /tmp/pastillas-proxy-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout /tmp/pastillas-proxy-certs/key.pem -out /tmp/pastillas-proxy-certs/cert.pem
          trap 'docker rm -fv pastillas-proxy-nginx pastillas-proxy-backend; docker network rm pastillas-proxy-check' EXIT
          docker network create pastillas-proxy-check
          docker run -d --name pastillas-proxy-backend --network pastillas-proxy-check -v /data --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=32m -e INITIAL_ADMIN_USER=proxy-test -e INITIAL_ADMIN_PASSWORD=contrasena-proxy-123 -e COOKIE_SECURE=auto -p 127.0.0.1:8095:8000 pastillas:test
          docker run -d --name pastillas-proxy-nginx --network pastillas-proxy-check -v "$PWD/tests/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro" -v /tmp/pastillas-proxy-certs:/etc/nginx/certs:ro -p 127.0.0.1:8096:80 -p 127.0.0.1:8444:443 -p 127.0.0.1:8445:444 nginx:1.28-alpine
          for attempt in $(seq 1 30); do
            if curl -fsS --cacert /tmp/pastillas-proxy-certs/cert.pem https://127.0.0.1:8444/healthz; then break; fi
            sleep 1
          done
          curl -fsS --cacert /tmp/pastillas-proxy-certs/cert.pem https://127.0.0.1:8444/healthz
          PLAYWRIGHT_MODULE=/tmp/pastillas-browser/node_modules/playwright-core CHROMIUM_PATH=/usr/bin/google-chrome node tests/proxy_smoke.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pastillas-preview
          path: test-results/*.png
          if-no-files-found: ignore
